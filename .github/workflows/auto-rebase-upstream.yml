# Auto-rebase / upstream-drift detector for the path-coverage fork.
#
# The fork carries a stack of path-coverage patches (System.Coverage.enterTest,
# recordPathHit, --dumppaths-json, effect_boundary, ES/Chez/RefC codegen hooks)
# on top of idris-lang/Idris2. Those patches touch drift-prone compiler internals
# (src/Compiler/Common.idr, CompileExpr.idr, ES/Codegen.idr, libs/base/System/
# Coverage.idr), so an upstream change can silently break them. This workflow
# keeps the fork HIGH-FIDELITY to upstream by detecting that drift early — every
# day and on demand — instead of discovering it the next time Luci needs a fresh
# --dumppaths-json build.
#
# It is a NON-DESTRUCTIVE detector: it merges fresh upstream into a throwaway
# probe branch and bootstraps the compiler. On clean merge + successful build it
# reports green; on a merge conflict or a build break it fails the run (and, on
# the default branch, opens/updates a tracking issue) so a human/agent rebases
# deliberately. It never force-pushes the fork's main.
#
# Remotes in this checkout: origin = idris-lang/Idris2 (upstream),
# fork = shogochiai/Idris2 (ours). GitHub Actions checks out the fork as origin,
# so the workflow adds idris-lang as an explicit `upstream` remote.

name: auto-rebase-upstream

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC — off-peak, avoids the top-of-hour stampede
  workflow_dispatch:        # manual "check drift now"

permissions:
  contents: read
  issues: write             # to open/update the drift tracking issue

concurrency:
  group: auto-rebase-upstream
  cancel-in-progress: true

jobs:
  drift-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history — rebase/merge needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote (idris-lang/Idris2)
        run: |
          git remote add upstream https://github.com/idris-lang/Idris2.git || \
            git remote set-url upstream https://github.com/idris-lang/Idris2.git
          git fetch --no-tags upstream main

      - name: Report the fork's patch stack (what could drift)
        run: |
          echo "Fork commits not in upstream/main:"
          git log --oneline upstream/main..HEAD || true
          echo "---"
          echo "Files those patches touch (drift surface):"
          git diff --name-only upstream/main...HEAD || true

      - name: Merge upstream into a probe branch (non-destructive)
        id: merge
        run: |
          git config user.name  "auto-rebase-bot"
          git config user.email "auto-rebase-bot@users.noreply.github.com"
          git checkout -B ci/upstream-drift-probe
          set +e
          git merge --no-edit upstream/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "::error::Merge with upstream/main CONFLICTS — the fork's path-coverage patches need a manual rebase."
            echo "Conflicted paths:"
            git diff --name-only --diff-filter=U || true
            git merge --abort || true
            exit 1
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "Clean merge with upstream/main."

      # Only reached when the merge was clean — now prove the merged tree still
      # BUILDS (a clean merge can still be semantically broken by an upstream API
      # change to a function the patches call).
      - name: Install Chez Scheme (bootstrap backend)
        run: sudo apt-get update && sudo apt-get install -y chezscheme

      # Bootstrap-build the merged tree — but this is a SECONDARY, best-effort
      # signal, NOT the drift verdict. `make bootstrap` builds base with the STOCK
      # bootstrap compiler, which does NOT know the fork's `%extern
      # prim__enterTest` (that primitive is resolved by the fork's OWN idris2, not
      # the bootstrap one), so the base build ALWAYS stops at
      #   INTERNAL ERROR: Can't compile unknown external primitive
      #     System.Coverage.prim__enterTest
      # That is a KNOWN structural asymmetry of the patch stack (the %extern-vs-
      # %foreign issue tracked as `action│foreign-paths`), not upstream drift. So a
      # build break here is a WARNING, and the CLEAN-MERGE result is the drift
      # verdict: a conflicting merge (handled above with exit 1) is the real "rebase
      # needed" signal. We still run bootstrap and surface WHERE it stopped, because
      # if it fails BEFORE System.Coverage (a genuine upstream API break) that IS
      # real drift worth eyeballing — the log line distinguishes the two.
      - name: Bootstrap-build the merged compiler (best-effort; enterTest asymmetry expected)
        id: bootstrap
        env:
          SCHEME: scheme
        run: |
          set +e
          make bootstrap > /tmp/bootstrap.log 2>&1
          rc=$?
          set -e
          tail -40 /tmp/bootstrap.log || true
          if [ "$rc" -eq 0 ]; then
            echo "Merged compiler bootstrapped fully — no build-level drift."
            echo "bootstrap=ok" >> "$GITHUB_OUTPUT"
          elif grep -q "prim__enterTest" /tmp/bootstrap.log; then
            echo "::warning::bootstrap stopped at the KNOWN %extern prim__enterTest asymmetry (not upstream drift). Merge was clean; the fork's own idris2 builds this. Track: action│foreign-paths (%extern→%foreign)."
            echo "bootstrap=known-extern" >> "$GITHUB_OUTPUT"
          else
            echo "::error::bootstrap failed BEFORE System.Coverage — this is a GENUINE upstream API break, not the known enterTest asymmetry."
            echo "bootstrap=real-drift" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # A drift tracking issue is opened only when the merge CONFLICTS or the
      # bootstrap fails for a REASON OTHER THAN the known enterTest asymmetry. Issue
      # creation is best-effort: many forks disable Issues, so a disabled-Issues
      # error must NOT fail the run (the ::error:: annotations above already surface
      # the drift). Falls back to writing the drift report to the job summary.
      - name: Report drift (issue if enabled, else job summary)
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'upstream drift: fork needs a rebase';
            const body = [
              'The upstream-drift probe failed: merging `idris-lang/Idris2@main` into the',
              'path-coverage fork **conflicts**, or the bootstrap broke for a reason other than',
              'the known `%extern prim__enterTest` asymmetry.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Rebase the path-coverage patch stack (System.Coverage.enterTest / recordPathHit /',
              '--dumppaths-json / effect_boundary / ES-Chez-RefC codegen hooks) onto fresh upstream,',
              'rebuild with the fork\'s own idris2, and confirm `idris2 --dumppaths-json` still emits path_ids.',
            ].join('\n');
            // Always write the report to the job summary — visible even when Issues are off.
            await core.summary.addHeading('Upstream drift detected').addRaw(body).write();
            try {
              const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
              const found = await github.rest.search.issuesAndPullRequests({ q });
              if (found.data.total_count > 0) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: found.data.items[0].number, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body, labels: ['upstream-drift'] });
              }
            } catch (e) {
              core.warning(`Issue tracking unavailable (${e.message}); drift is in the job summary instead.`);
            }
